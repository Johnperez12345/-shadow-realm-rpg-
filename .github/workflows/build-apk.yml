name: Build Wildwood Survival APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        run: |
          if [ ! -f "settings.gradle" ] || [ ! -f "app/build.gradle" ]; then
            ARCHIVE="$(find . -maxdepth 2 -type f -name 'wildwood_survival_github_apk_build*.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "Android project ZIP not found and Gradle files are missing."
              exit 1
            fi
            unzip -o "$ARCHIVE" -d .
          fi
          test -f settings.gradle
          test -f app/build.gradle
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            if [ -f app/src/main/androidmanifest.xml ]; then
              mv app/src/main/androidmanifest.xml app/src/main/AndroidManifest.xml
            fi
          fi
          test -f app/src/main/AndroidManifest.xml
          if [ -f updates/patch_game.py ]; then
            python3 updates/patch_game.py
          fi
          python3 - <<'PY'
          import re
          p="app/src/main/assets/index.html"
          s=open(p,encoding="utf-8").read()
          print("=== CRAFT SOURCE INSPECTION ===")
          for pattern in [r"(?:const|let|var) ITEMS\s*=",r"(?:const|let|var) RECIPES\s*=",r"(?:const|let|var) STATION_NAME\s*=",r"function nearStations\s*\(",r"function renderModal\s*\("]:
              m=re.search(pattern,s)
              if m:
                  a=max(0,m.start()-100); b=min(len(s),m.start()+5000)
                  print("\n---",pattern,"---\n",s[a:b])
          print("=== END CRAFT SOURCE INSPECTION ===")
          PY
          # Java public class MainActivity must match the filename on Linux.
          if [ -f app/src/main/java/com/wildwood/survival/mainactivity.java ] && [ ! -f app/src/main/java/com/wildwood/survival/MainActivity.java ]; then
            mv app/src/main/java/com/wildwood/survival/mainactivity.java app/src/main/java/com/wildwood/survival/MainActivity.java
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildwood-survival-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
